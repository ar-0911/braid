[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "braid-agents"
version = "0.1.0"
description = "Run many coding agents on one repo at once: shared memory, early conflict prediction, code-aware merging, peer review and automatic landing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
braid = "braid.cli:main"

[tool.setuptools]
packages = ["braid"]
